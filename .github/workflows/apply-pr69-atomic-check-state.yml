name: Apply PR 69 atomic check state review

on:
  push:
    branches:
      - feat/runtime-update-advisory
    paths:
      - .github/review-fixes/atomic-check-state.py
      - .github/workflows/apply-pr69-atomic-check-state.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out advisory branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/runtime-update-advisory
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true
      - name: Apply and validate atomic check state
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/review-fixes/atomic-check-state.py
          sh -n bin/traceknot-skills-update skill/bin/traceknot-skills-update tests/skills-updater-smoke.sh
          cmp -s bin/traceknot-skills-update skill/bin/traceknot-skills-update
          sh tests/skills-updater-smoke.sh
          sh tests/update-notice-smoke.sh
          sh scripts/ci
          git diff --check
      - name: Commit clean reviewed branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f -- \
            .github/review-fixes/atomic-check-state.py \
            .github/workflows/apply-pr69-atomic-check-state.yml
          git add -- bin/traceknot-skills-update skill/bin/traceknot-skills-update tests/skills-updater-smoke.sh
          git commit -m "fix: commit update check timestamps atomically"
          git push origin HEAD:feat/runtime-update-advisory
