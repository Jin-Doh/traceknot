name: Trusted release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Jin-Doh/traceknot'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Run canonical gate
        run: sh scripts/ci

      - name: Derive release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build deterministic release assets
        env:
          TRACEKNOT_PUBLISHED_AT: ${{ github.event.head_commit.timestamp }}
        run: >-
          sh scripts/package-release.sh
          --version '${{ steps.release.outputs.version }}'
          --source-commit '${{ github.sha }}'
          --output dist

      - name: Validate update manifest
        run: >-
          bun x --no-install ajv validate --spec=draft2020
          -s contracts/update-manifest.schema.json
          -d dist/traceknot-update-manifest.json

      - name: Attest release archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/traceknot-v${{ steps.release.outputs.version }}.tar.gz

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/traceknot-v${{ steps.release.outputs.version }}.tar.gz" \
            dist/traceknot-update-manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes

      - name: Verify repository immutability enforcement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          immutable=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            --jq '.immutable')
          test "$immutable" = true || {
            printf '%s\n' 'Release is not immutable; enable immutable releases before publishing another version.' >&2
            exit 1
          }
