name: Trusted release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Jin-Doh/traceknot'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Resolve and validate tagged source
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == tag ]] || {
            printf '%s\n' 'Trusted release must run with a tag ref.' >&2
            exit 1
          }
          git fetch --no-tags origin main
          tag=$GITHUB_REF_NAME
          version=${tag#v}
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          source_commit=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$source_commit" origin/main || {
            printf '%s\n' 'Release tags must identify a commit contained in main.' >&2
            exit 1
          }
          published_at=$(gh api "/repos/$GITHUB_REPOSITORY/commits/$source_commit" \
            --jq '.commit.committer.date')
          {
            printf 'version=%s\n' "$version"
            printf 'tag=%s\n' "$tag"
            printf 'sourceCommit=%s\n' "$source_commit"
            printf 'publishedAt=%s\n' "$published_at"
          } >> "$GITHUB_OUTPUT"

      - name: Run canonical gate
        run: sh scripts/ci

      - name: Build deterministic release assets
        env:
          TRACEKNOT_PUBLISHED_AT: ${{ steps.release.outputs.publishedAt }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_COMMIT: ${{ steps.release.outputs.sourceCommit }}
        run: >-
          sh scripts/package-release.sh
          --version "$RELEASE_VERSION"
          --source-commit "$SOURCE_COMMIT"
          --output dist

      - name: Validate update manifest
        run: >-
          bun x --no-install ajv validate --spec=draft2020
          -s contracts/update-manifest.schema.json
          -d dist/traceknot-update-manifest.json

      - name: Attest release archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/traceknot-v${{ steps.release.outputs.version }}.tar.gz

      - name: Publish immutable release assets
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "dist/traceknot-v${RELEASE_VERSION}.tar.gz" \
            dist/traceknot-update-manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes

      - name: Verify public release surfaces
        if: always() && steps.publish.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.release.outputs.sourceCommit }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          set +e
          sh scripts/verify-published-release.sh \
            --tag "$RELEASE_TAG" \
            --source-commit "$SOURCE_COMMIT" \
            --output release-evidence \
            2>&1 | tee release-evidence/verifier.log
          verifier_status=${PIPESTATUS[0]}
          set -e
          if [ "$verifier_status" -eq 0 ]; then result=passed; else result=failed; fi
          jq -n --arg status "$result" --argjson exitStatus "$verifier_status" \
            '{schemaVersion:"traceknot-release-verification-status/v1",
              status:$status,exitStatus:$exitStatus}' \
            > release-evidence/verification-status.json
          exit "$verifier_status"

      - name: Publish release evidence summary
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          evidence=release-evidence/release-evidence.json
          {
            printf "## Release evidence: \`%s\`\n\n" "$RELEASE_TAG"
            printf -- "- Release: %s\n" "$(jq -r .releaseUrl "$evidence")"
            printf -- "- Source commit: \`%s\`\n" "$(jq -r .sourceCommit "$evidence")"
            printf -- "- Artifact SHA-256: \`%s\`\n" "$(jq -r .artifact.sha256 "$evidence")"
            printf -- "- Manifest SHA-256: \`%s\`\n" "$(jq -r .manifestSha256 "$evidence")"
            printf -- "- Verified at: \`%s\`\n" "$(jq -r .verifiedAt "$evidence")"
            printf -- "- First eligible instant: \`%s\`\n" "$(jq -r .eligibleAfter "$evidence")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain release verification evidence
        if: always() && steps.publish.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ steps.release.outputs.tag }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90
