name: Apply PR 69 review patch

on:
  push:
    branches:
      - feat/runtime-update-advisory
    paths:
      - .github/apply-pr69-review.py
      - .github/workflows/apply-pr69-review.yml

permissions:
  contents: write

concurrency:
  group: apply-pr69-review
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out stacked PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: feat/runtime-update-advisory
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Restack on reviewed PR 68 head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/skills-cli-auto-update
          git merge --no-commit --no-ff origin/fix/skills-cli-auto-update || true
          git checkout origin/fix/skills-cli-auto-update -- \
            bin/traceknot-skills-update \
            skill/bin/traceknot-skills-update \
            docs/automatic-updates.md \
            tests/skills-updater-smoke.sh
          git add -- \
            bin/traceknot-skills-update \
            skill/bin/traceknot-skills-update \
            docs/automatic-updates.md \
            tests/skills-updater-smoke.sh
          if git ls-files -u | grep -q .; then
            git ls-files -u >&2
            exit 1
          fi
      - name: Apply advisory review changes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/apply-pr69-review.py
      - name: Validate stacked patch
        shell: bash
        run: |
          set -euo pipefail
          sh -n \
            bin/traceknot-skills-update \
            skill/bin/traceknot-skills-update \
            bin/traceknot-update-notice \
            skill/bin/traceknot-update-notice \
            tests/skills-updater-smoke.sh \
            tests/update-notice-smoke.sh
          cmp -s bin/traceknot-skills-update skill/bin/traceknot-skills-update
          cmp -s bin/traceknot-update-notice skill/bin/traceknot-update-notice
          sh tests/skills-updater-smoke.sh
          sh tests/update-notice-smoke.sh
          sh scripts/ci
      - name: Commit reviewed stacked implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- \
            .github/apply-pr69-review.py \
            .github/workflows/apply-pr69-review.yml
          git add -- \
            bin/traceknot-skills-update \
            skill/bin/traceknot-skills-update \
            bin/traceknot-update-notice \
            skill/bin/traceknot-update-notice \
            docs/automatic-updates.md \
            tests/skills-updater-smoke.sh \
            tests/update-notice-smoke.sh
          git diff --cached --check
          git commit -m 'fix: bound advisory checks to one deadline'
          git push origin HEAD:feat/runtime-update-advisory
