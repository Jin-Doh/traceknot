name: Promote release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semantic version to promote
        required: true
        type: string
      sourceCommit:
        description: Full current main commit SHA; prevents approving a moving target
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: promote-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  promote:
    if: github.repository == 'Jin-Doh/traceknot'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Validate approved release identity
        id: release
        shell: bash
        env:
          APPROVED_VERSION: ${{ inputs.version }}
          APPROVED_COMMIT: ${{ inputs.sourceCommit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          source_commit=$(git rev-parse HEAD)
          [[ "$source_commit" == "$APPROVED_COMMIT" ]] || {
            printf '%s\n' 'The approved sourceCommit is no longer the current main commit.' >&2
            exit 1
          }
          tag=v$APPROVED_VERSION
          if gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            printf 'Tag already exists: %s\n' "$tag" >&2
            exit 1
          fi
          if gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$tag" >/dev/null 2>&1; then
            printf 'Release already exists: %s\n' "$tag" >&2
            exit 1
          fi
          {
            printf 'tag=%s\n' "$tag"
            printf 'sourceCommit=%s\n' "$source_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Run canonical gate before promotion
        run: sh scripts/ci

      - name: Create protected release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.release.outputs.sourceCommit }}
        run: >-
          gh api --method POST "/repos/$GITHUB_REPOSITORY/git/refs"
          -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$SOURCE_COMMIT"
          >/dev/null

      - name: Dispatch trusted release in tag context
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh workflow run release.yml --ref "$RELEASE_TAG"

      - name: Record promotion handoff
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.release.outputs.sourceCommit }}
        run: |
          {
            printf "## Release promotion handed off\n\n"
            printf -- "- Tag: \`%s\`\n" "$RELEASE_TAG"
            printf -- "- Source commit: \`%s\`\n" "$SOURCE_COMMIT"
            printf -- "- Publisher: \`Trusted release\` (tag-ref dispatch)\n"
          } >> "$GITHUB_STEP_SUMMARY"
