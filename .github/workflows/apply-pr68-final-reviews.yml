name: Apply final PR 68 review fixes

on:
  push:
    branches:
      - fix/skills-cli-auto-update
    paths:
      - .github/review-fixes/apply-pr68-final-reviews.py
      - .github/workflows/apply-pr68-final-reviews.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/skills-cli-auto-update
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Apply review fixes
        run: python3 .github/review-fixes/apply-pr68-final-reviews.py

      - name: Validate review fixes
        shell: bash
        run: |
          set -euo pipefail
          sh -n bin/traceknot-skills-update skill/bin/traceknot-skills-update tests/skills-updater-smoke.sh
          cmp -s bin/traceknot-skills-update skill/bin/traceknot-skills-update
          sh tests/skills-updater-smoke.sh
          sh scripts/ci
          git diff --check

      - name: Commit reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f -- .github/review-fixes/apply-pr68-final-reviews.py .github/workflows/apply-pr68-final-reviews.yml
          git add -- bin/traceknot-skills-update skill/bin/traceknot-skills-update tests/skills-updater-smoke.sh
          git commit -m "fix: close updater timeout and mutation races"
          git push origin HEAD:fix/skills-cli-auto-update
