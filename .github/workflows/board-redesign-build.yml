name: QA Board redesign build

on:
  push:
    branches:
      - feat/unified-skill-session-board
    paths:
      - '.github/board-redesign-build.py.gz.b64'

permissions:
  contents: read

concurrency:
  group: qa-board-redesign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Apply QA Board redesign
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/board-redesign-build.py.gz.b64 | gzip --decompress > /tmp/board-redesign-build.py
          python3 /tmp/board-redesign-build.py
          bun scripts/build-skill-runtime.ts

      - name: Run canonical gate
        run: sh scripts/ci

      - name: Render visual review fixtures
        shell: bash
        run: |
          set -euo pipefail
          bun .github/board-redesign-preview.ts preview
          browser=$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)
          if [[ -n "$browser" ]]; then
            "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=1440,3000 --force-device-scale-factor=1 \
              --screenshot=preview/qa-board-pass-en.png \
              "file://$GITHUB_WORKSPACE/preview/qa-board-pass-en.html"
            "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-dark-mode \
              --window-size=1440,3000 --force-device-scale-factor=1 \
              --screenshot=preview/qa-board-pass-ko-dark.png \
              "file://$GITHUB_WORKSPACE/preview/qa-board-pass-ko.html"
            "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=1440,3000 --force-device-scale-factor=1 \
              --screenshot=preview/qa-board-mixed-en.png \
              "file://$GITHUB_WORKSPACE/preview/qa-board-mixed-en.html"
          fi

      - name: Upload redesigned sources and previews
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-board-redesign-${{ github.sha }}
          path: |
            system/presentation/qa-board.ts
            system/presentation/qa-board-locale.ts
            system/presentation/qa-board.test.ts
            system/presentation/qa-board-store.ts
            system/cli/verify.ts
            system/cli/board.ts
            system/cli/board.test.ts
            skill/bin/traceknot
            preview/
          if-no-files-found: error
          retention-days: 1
