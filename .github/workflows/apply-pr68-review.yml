name: Apply PR 68 review patch

on:
  push:
    branches:
      - fix/skills-cli-auto-update
    paths:
      - .github/apply-pr68-review.py.gz
      - .github/workflows/apply-pr68-review.yml

permissions:
  contents: write

concurrency:
  group: apply-pr68-review
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: fix/skills-cli-auto-update
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Apply review patch
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc .github/apply-pr68-review.py.gz > "$RUNNER_TEMP/apply-pr68-review.py"
          python3 "$RUNNER_TEMP/apply-pr68-review.py"
      - name: Validate patched branch
        shell: bash
        run: |
          set -euo pipefail
          sh -n bin/traceknot-skills-update skill/bin/traceknot-skills-update tests/skills-updater-smoke.sh
          cmp -s bin/traceknot-skills-update skill/bin/traceknot-skills-update
          sh tests/skills-updater-smoke.sh
          sh scripts/ci
      - name: Commit reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/apply-pr68-review.py.gz .github/workflows/apply-pr68-review.yml
          git add -- \
            bin/traceknot-skills-update \
            skill/bin/traceknot-skills-update \
            tests/skills-updater-smoke.sh \
            docs/automatic-updates.md
          git diff --cached --check
          git commit -m 'fix: support canonical locks and bounded adoption'
          git push origin HEAD:fix/skills-cli-auto-update
