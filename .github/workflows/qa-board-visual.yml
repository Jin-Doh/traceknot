name: QA Board visual

on:
  pull_request:
    paths:
      - 'assets/traceknot-mark.svg'
      - 'system/presentation/qa-board*.ts'
      - 'system/cli/board*.ts'
      - 'system/cli/verify.ts'
      - 'scripts/render-qa-board-visual-fixtures.ts'
      - 'scripts/capture-qa-board-visual.ts'
      - '.github/workflows/qa-board-visual.yml'
      - 'package.json'
      - 'bun.lock'
  push:
    branches:
      - main
    paths:
      - 'assets/traceknot-mark.svg'
      - 'system/presentation/qa-board*.ts'
      - 'system/cli/board*.ts'
      - 'system/cli/verify.ts'
      - 'scripts/render-qa-board-visual-fixtures.ts'
      - 'scripts/capture-qa-board-visual.ts'
      - '.github/workflows/qa-board-visual.yml'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-board-visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk

      - name: Verify renderer contracts
        run: bun test system/presentation/qa-board.test.ts system/presentation/qa-board-store.test.ts system/cli/board.test.ts

      - name: Render snapshot-bound fixtures
        env:
          SNAPSHOT_ID: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/render-qa-board-visual-fixtures.ts preview "$SNAPSHOT_ID"

      - name: Capture desktop mobile and localized Boards
        shell: bash
        env:
          SNAPSHOT_ID: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          browser=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          bun scripts/capture-qa-board-visual.ts \
            --browser "$browser" \
            --input preview \
            --output preview \
            --snapshot "$SNAPSHOT_ID"

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-board-visual-${{ github.event.pull_request.head.sha || github.sha }}
          path: preview/
          if-no-files-found: error
          retention-days: 7
