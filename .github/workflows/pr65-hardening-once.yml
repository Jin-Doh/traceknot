name: Apply PR65 hardening fixes

on:
  push:
    branches:
      - feat/unified-skill-session-board

permissions:
  contents: write

concurrency:
  group: pr65-hardening-once
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/unified-skill-session-board
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Apply focused fixes and regressions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement anchor, found {count}")
              p.write_text(text.replace(old, new, 1))

          publication = "system/runtime/board-publication.ts"
          replace_once(
              publication,
              '''  return manifest as unknown as QaBoardManifest;\n}\n\n\nexport async function validatePublishedBoard(''',
              '''  return manifest as unknown as QaBoardManifest;\n}\n\ntype PublishedCurrent = Readonly<{\n  schemaVersion: "traceknot-session-board-current/v1";\n  sessionKey: string;\n  sourceRevision: number;\n  invocationId: string;\n  revisionPath: string;\n  entrypoint: "index.html";\n  entrypointSha256: string;\n  manifestSha256: string;\n  sessionRef: string;\n  generatedAt: string;\n  authoritative: false;\n}>;\n\nfunction parsePublishedCurrent(value: unknown, sessionKey: string, selectorTarget: string): PublishedCurrent {\n  const current = object(value, "canonical Board current pointer");\n  const required = ["schemaVersion", "sessionKey", "sourceRevision", "invocationId", "revisionPath", "entrypoint", "entrypointSha256", "manifestSha256", "sessionRef", "generatedAt", "authoritative"] as const;\n  if (!closedKeys(current, required)) throw Error("canonical Board publisher current pointer keys are invalid");\n  if (current.schemaVersion !== "traceknot-session-board-current/v1" || current.sessionKey !== sessionKey || current.revisionPath !== selectorTarget || current.entrypoint !== "index.html" || current.authoritative !== false) {\n    throw Error("canonical Board publisher reported an invalid current pointer");\n  }\n  if (!Number.isSafeInteger(current.sourceRevision) || Number(current.sourceRevision) < 0) throw Error("canonical Board publisher current pointer sourceRevision is invalid");\n  if (typeof current.invocationId !== "string" || !/^(?!.*\\.\\.)[A-Za-z0-9][A-Za-z0-9._-]{0,127}$/.test(current.invocationId)) throw Error("canonical Board publisher current pointer invocationId is invalid");\n  if (typeof current.entrypointSha256 !== "string" || !/^[0-9a-f]{64}$/.test(current.entrypointSha256) || typeof current.manifestSha256 !== "string" || !/^[0-9a-f]{64}$/.test(current.manifestSha256)) {\n    throw Error("canonical Board publisher current pointer digest is invalid");\n  }\n  if (typeof current.sessionRef !== "string" || current.sessionRef.length === 0) throw Error("canonical Board publisher current pointer sessionRef is invalid");\n  if (typeof current.generatedAt !== "string" || !/^\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|02-(?:0[1-9]|1\\d|2\\d))T(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?Z$/.test(current.generatedAt) || !Number.isFinite(Date.parse(current.generatedAt))) {\n    throw Error("canonical Board publisher current pointer generatedAt is invalid");\n  }\n  const [year, month, day] = current.generatedAt.slice(0, 10).split("-").map(Number) as [number, number, number];\n  const leapYear = year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0);\n  const daysInMonth = [31, leapYear ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][month - 1]!;\n  if (day > daysInMonth) throw Error("canonical Board publisher current pointer generatedAt is invalid");\n  return current as unknown as PublishedCurrent;\n}\n\nexport async function validatePublishedBoard('''
          )
          replace_once(
              publication,
              '''    let current: Record<string, unknown>;\n    try { current = JSON.parse(new TextDecoder().decode(currentBytes)) as Record<string, unknown>; } catch { throw Error("canonical Board publisher reported malformed current.json"); }\n    if (expected?.sessionId !== undefined && containsBoundaryIdentity(new TextDecoder("utf-8", { fatal: true }).decode(currentBytes), expected.sessionId)) throw Error("canonical Board publisher current pointer exposes the raw session ID");\n    if (current.schemaVersion !== "traceknot-session-board-current/v1" || current.sessionKey !== sessionKey || current.entrypoint !== "index.html" || current.authoritative !== false || current.revisionPath !== selectorTarget || typeof current.entrypointSha256 !== "string" || !/^[0-9a-f]{64}$/.test(current.entrypointSha256) || typeof current.manifestSha256 !== "string" || !/^[0-9a-f]{64}$/.test(current.manifestSha256) || typeof current.sessionRef !== "string") throw Error("canonical Board publisher reported an invalid current pointer");''',
              '''    let currentValue: unknown;\n    try { currentValue = JSON.parse(new TextDecoder().decode(currentBytes)) as unknown; } catch { throw Error("canonical Board publisher reported malformed current.json"); }\n    if (expected?.sessionId !== undefined && containsBoundaryIdentity(new TextDecoder("utf-8", { fatal: true }).decode(currentBytes), expected.sessionId)) throw Error("canonical Board publisher current pointer exposes the raw session ID");\n    const current = parsePublishedCurrent(currentValue, sessionKey, selectorTarget);'''
          )

          publisher_test = "system/runtime/board-publisher.test.ts"
          replace_once(
              publisher_test,
              '''  test("rejects an integrity-consistent Board page that exposes the raw session ID", async () => {''',
              '''  test("rejects incomplete, unsafe, or open-shaped current pointer contracts", async () => {\n    const mutations: Array<(current: Record<string, unknown>) => void> = [\n      current => { delete current.sourceRevision; },\n      current => { current.unexpected = true; },\n      current => { current.invocationId = "../unsafe"; },\n      current => { current.generatedAt = "not-a-timestamp"; },\n    ];\n    for (const mutate of mutations) {\n      const fixture = await boardFixture();\n      try {\n        const sessionRoot = dirname(fileURLToPath(fixture.entrypoint));\n        const currentPath = join(sessionRoot, "current.json");\n        const current = JSON.parse(await readFile(currentPath, "utf8")) as Record<string, unknown>;\n        mutate(current);\n        await writeFile(currentPath, `${JSON.stringify(current, null, 2)}\\n`);\n        const runner: CanonicalCliRunner = async () => ({ exitCode: 0, stdout: "", stderr: `Traceknot Board: ${fixture.entrypoint}\\n` });\n        await expect(createCanonicalCliBoardPublisher({ executable: "/bin/traceknot", runner }).publish({ ...request, stateDir: fixture.root }))\n          .rejects.toThrow(/current pointer/u);\n      } finally {\n        await rm(fixture.root, { recursive: true, force: true });\n      }\n    }\n  });\n\n  test("rejects an integrity-consistent Board page that exposes the raw session ID", async () => {'''
          )

          store = "system/presentation/qa-board-store.ts"
          replace_once(
              store,
              '''async function removeTreeAt(parentFd: number, parentPath: string, name: string): Promise<void> {''',
              '''async function assertTreeRemovalPreflight(parentPath: string, name: string): Promise<void> {\n  if (!SAFE_BOARD_NAME.test(name) && !name.startsWith(".pending-")) throw new Error("Board cleanup target contains unsafe characters");\n  const directoryPath = join(parentPath, name);\n  const entries = await readdir(directoryPath, { withFileTypes: true });\n  for (const entry of entries) {\n    if (entry.isDirectory() && !entry.isSymbolicLink()) {\n      await assertTreeRemovalPreflight(directoryPath, entry.name);\n    }\n  }\n}\n\nasync function removeTreeAt(parentFd: number, parentPath: string, name: string): Promise<void> {'''
          )
          replace_once(
              store,
              '''  const deletionOrder = [...selected].sort((a, b) => Number(a.name === removeLast) - Number(b.name === removeLast));\n  for (const candidate of deletionOrder) {''',
              '''  const deletionOrder = [...selected].sort((a, b) => Number(a.name === removeLast) - Number(b.name === removeLast));\n  for (const candidate of deletionOrder) await assertTreeRemovalPreflight(boardsPath, candidate.name);\n  for (const candidate of deletionOrder) {'''
          )

          session_test = "system/presentation/session-board.test.ts"
          replace_once(
              session_test,
              '''  test("rotates active revisions by the session maximum without deleting current", async () => {''',
              '''  test("preflights previous-current reclaim before any destructive rollback-target deletion", async () => {\n    const fixtureValue = await fixture();\n    const current = await publishSessionBoardUpdate({ update: parseSessionBoardUpdate(update(2, "current-preflight", "EXECUTING")), ...fixtureValue });\n    const indexBefore = await readFile(join(current.directory, "index.html"));\n    const manifestBefore = await readFile(join(current.directory, "manifest.json"));\n    await mkdir(join(current.directory, ".unsafe"));\n\n    await expect(publishSessionBoardUpdate({\n      update: parseSessionBoardUpdate(update(3, "incoming-preflight", "EXECUTING")),\n      ...fixtureValue,\n      retentionPolicy: { boardMaxPerSession: 1 },\n    })).rejects.toThrow("unsafe characters");\n\n    expect(JSON.parse(await readFile(current.currentPath, "utf8"))).toMatchObject({ revisionPath: "boards/2-current-preflight" });\n    expect(await readFile(join(current.directory, "index.html"))).toEqual(indexBefore);\n    expect(await readFile(join(current.directory, "manifest.json"))).toEqual(manifestBefore);\n    expect(await stat(join(current.directory, ".unsafe"))).toBeDefined();\n    await expect(stat(join(fixtureValue.stateDir, "sessions", current.sessionKey, "boards", "3-incoming-preflight"))).rejects.toThrow();\n  });\n\n  test("rotates active revisions by the session maximum without deleting current", async () => {'''
          )
          PY

      - name: Run canonical gate
        shell: bash
        run: sh scripts/ci

      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr65-hardening-once.yml
          git add system/runtime/board-publication.ts system/runtime/board-publisher.test.ts system/presentation/qa-board-store.ts system/presentation/session-board.test.ts
          git diff --cached --check
          git commit -m "fix: harden Board publication invariants"
          git push origin HEAD:feat/unified-skill-session-board
