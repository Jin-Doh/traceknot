name: Apply current PR 68 review fixes

on:
  push:
    branches:
      - fix/skills-cli-auto-update
    paths:
      - .github/review-fixes/apply-pr68-current.py
      - .github/review-fixes/fix-pr68-transform.py
      - .github/workflows/apply-pr68-current-review.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/review-fixes/apply-pr68-current.py
      - .github/review-fixes/fix-pr68-transform.py
      - .github/workflows/apply-pr68-current-review.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/skills-cli-auto-update
          fetch-depth: 0
      - name: Apply asserted transformations
        run: |
          python3 .github/review-fixes/fix-pr68-transform.py
          python3 .github/review-fixes/apply-pr68-current.py
      - name: Run focused validation
        run: |
          sh -n bin/traceknot-skills-update skill/bin/traceknot-skills-update bin/traceknot-update tests/skills-updater-smoke.sh
          cmp -s bin/traceknot-skills-update skill/bin/traceknot-skills-update
          sh tests/skills-updater-smoke.sh
          git diff --check
      - name: Commit patched branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -- .github/review-fixes/apply-pr68-current.py .github/review-fixes/fix-pr68-transform.py .github/workflows/apply-pr68-current-review.yml
          git add -- bin/traceknot-skills-update skill/bin/traceknot-skills-update bin/traceknot-update tests/skills-updater-smoke.sh docs/automatic-updates.md
          git commit -m "fix: close updater concurrency and verification gaps"
          git push origin HEAD:fix/skills-cli-auto-update
