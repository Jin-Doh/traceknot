name: Restack PR 69 on current PR 68

on:
  push:
    branches:
      - feat/runtime-update-advisory
    paths:
      - .github/review-fixes/apply-pr69-restack.py
      - .github/review-fixes/apply-pr69-final-reviews.py
      - .github/workflows/restack-pr69-current-review.yml
  pull_request:
    branches:
      - fix/skills-cli-auto-update
    paths:
      - .github/review-fixes/apply-pr69-restack.py
      - .github/review-fixes/apply-pr69-final-reviews.py
      - .github/workflows/restack-pr69-current-review.yml

permissions:
  contents: write

jobs:
  restack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out advisory branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/runtime-update-advisory
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Configure merge identity
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Restack and apply current review hardening
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/skills-cli-auto-update
          git merge --no-commit --no-ff -X ours origin/fix/skills-cli-auto-update
          python3 .github/review-fixes/apply-pr69-restack.py
          python3 .github/review-fixes/apply-pr69-final-reviews.py

      - name: Validate stacked result
        shell: bash
        run: |
          set -euo pipefail
          sh -n bin/traceknot-skills-update skill/bin/traceknot-skills-update \
            bin/traceknot-update-notice skill/bin/traceknot-update-notice \
            tests/skills-updater-smoke.sh tests/update-notice-smoke.sh
          cmp -s bin/traceknot-skills-update skill/bin/traceknot-skills-update
          cmp -s bin/traceknot-update-notice skill/bin/traceknot-update-notice
          sh tests/skills-updater-smoke.sh
          sh tests/update-notice-smoke.sh
          sh scripts/ci
          git diff --check

      - name: Commit stacked patch
        shell: bash
        run: |
          set -euo pipefail
          git rm -f -- \
            .github/review-fixes/apply-pr69-restack.py \
            .github/review-fixes/apply-pr69-final-reviews.py \
            .github/workflows/restack-pr69-current-review.yml \
            .github/ci-trigger-pr69.txt
          git add -- \
            bin/traceknot-skills-update skill/bin/traceknot-skills-update \
            bin/traceknot-update-notice skill/bin/traceknot-update-notice \
            tests/skills-updater-smoke.sh tests/update-notice-smoke.sh
          git commit -m "fix: restack advisory on final updater hardening"
          git push origin HEAD:feat/runtime-update-advisory
