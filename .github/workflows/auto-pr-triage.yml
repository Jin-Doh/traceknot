name: Auto PR triage

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - edited
      - synchronize

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-triage:
    name: Self-assign and label PRs
    runs-on: ubuntu-24.04
    steps:
      - name: Apply labels and self-assignment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const pr = context.payload.pull_request;
            const text = `${pr.title || ""}\n${pr.body || ""}`;
            const author = pr.user?.login;
            const isBotAuthor = pr.user?.type === "Bot";
            const hasBugToken = /(^|[^a-z0-9])(?:(?:bug|hot)fix(?:es|ed|ing)?|bugs?|fix(?:es|ed|ing)?)(?=$|[^a-z0-9])/i.test(text);
            const hasDocumentationToken = /(^|[^a-z0-9])(?:docs?|documentation|document(?:s|ed|ing)?|readme)(?=$|[^a-z0-9])/i.test(text);
            const hasGithubActionToken = /(^|[^a-z0-9])github[ _-]+actions?(?=$|[^a-z0-9])/i.test(text);

            const existingIssue = await github.rest.issues.get({
              owner,
              repo,
              issue_number: prNumber,
            });

            const changedFiles = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner,
                repo,
                pull_number: prNumber,
                per_page: 100,
              },
            );
            const filenames = changedFiles.map((item) => item.filename || "");

            const labels = new Set();

            if (hasBugToken) {
              labels.add("bug");
            }

            if (
              hasDocumentationToken ||
              filenames.some((file) => file.startsWith("docs/") || /^README/i.test(file) || file.endsWith(".md"))
            ) {
              labels.add("documentation");
            }

            if (
              filenames.some((file) => file.startsWith(".github/workflows/") || file.startsWith(".github/codeql/")) ||
              hasGithubActionToken
            ) {
              labels.add("github_actions");
            }

            if (
              filenames.some((file) =>
                file === "package.json" ||
                file === "bun.lock" ||
                file === "package-lock.json" ||
                file === "pnpm-lock.yaml" ||
                file === "yarn.lock" ||
                file === ".github/dependabot.yml"
              )
            ) {
              labels.add("dependencies");
            }

            if (labels.size === 0) {
              labels.add("enhancement");
            }

            const managedLabels = new Set(["bug", "documentation", "github_actions", "dependencies", "enhancement"]);
            const presentLabelNames = existingIssue.data.labels.map((label) => label.name);
            const presentLabels = new Set(presentLabelNames);
            const newLabels = [...labels].filter((label) => !presentLabels.has(label));
            const obsoleteLabels = presentLabelNames.filter((label) => managedLabels.has(label) && !labels.has(label));

            if (newLabels.length > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels: newLabels,
              });
            }

            for (const label of obsoleteLabels) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: prNumber,
                name: label,
              });
            }

            if (!isBotAuthor && author) {
              const hasAuthorAssigned = existingIssue.data.assignees?.some((assignee) => assignee.login === author);
              if (!hasAuthorAssigned) {
                let canAssign = true;
                try {
                  await github.rest.issues.checkUserCanBeAssigned({ owner, repo, assignee: author });
                } catch (error) {
                  if (error?.status === 404) {
                    canAssign = false;
                  } else {
                    throw error;
                  }
                }

                if (canAssign) {
                  await github.rest.issues.addAssignees({
                    owner,
                    repo,
                    issue_number: prNumber,
                    assignees: [author],
                  });
                }
              }
            }
